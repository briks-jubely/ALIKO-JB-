<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIKO JB Academy | Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
</head>
<body>
<div class="app">
  <h1>ALIKO JB Academy</h1>
  <p>Automotive Engineering Learning Platform</p>
  <!-- LOGIN FORM -->
  <form id="loginForm" class="form active" onsubmit="loginUserHandler(); return false;">
    <input id="login-email" type="email" placeholder="Email" required />
    <input id="login-password" type="password" placeholder="Password" required />
    <button type="submit" class="main-btn">Login</button>
    <p id="loginMsg" class="msg"></p>
  </form>

  <!-- REGISTER FORM -->
<p style="margin-top:15px; font-size:0.9rem; color:#00bcd4;">
  Haujajisajili? <a href="{{ url_for('register') }}" style="color:#00bcd4; text-decoration:underline;">Jisajili hapa</a>
</p>
</div>

<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
</body>
</html>
