<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIKO JB Academy | Register</title>
<link rel="stylesheet" href="../assets/css/ui.css">
</head>
<body>
<div class="app">
  <h1>ALIKO JB Academy</h1>
  <p>Automotive Engineering Learning Platform</p>
  <!-- REGISTER FORM -->
  <form id="regForm" class="form" onsubmit="registerUserHandler(); return false;">
    <input id="reg-username" placeholder="Full Name" required />
    <input id="reg-email" type="email" placeholder="Email" required />
    <input id="reg-password" type="password" placeholder="Password" required />
    <button type="submit" class="main-btn">Register</button>
    <p id="regMsg" class="msg"></p>
  </form>
<p style="margin-top:15px; font-size:0.9rem; color:#00bcd4;">
  Tayari una account? <a href="login.html" style="color:#00bcd4; text-decoration:underline;">Ingia hapa</a>
</p>
</div>

<script type="module" src="../js/login.js"></script>
<script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
